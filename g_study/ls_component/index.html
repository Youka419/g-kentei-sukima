<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>html, body { margin: 0; padding: 0; height: 0; overflow: hidden; }</style>
  </head>
  <body>
    <script>
      function send(type, data) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type: type }, data || {}),
          "*"
        );
      }
      function sendValue(value) {
        send("streamlit:setComponentValue", { value: value });
      }
      function setHeight(height) {
        send("streamlit:setFrameHeight", { height: height });
      }
      window.addEventListener("message", function (event) {
        var data = event.data || {};
        if (data.type !== "streamlit:render") return;
        var args = data.args || {};
        var storeKey = args.store_key || "gkentei_progress_v1";
        try {
          if (args.action === "set") {
            localStorage.setItem(storeKey, args.value || "");
            sendValue("saved");
          } else {
            sendValue(localStorage.getItem(storeKey) || "");
          }
        } catch (err) {
          sendValue("");
        }
        setHeight(0);
      });
      send("streamlit:componentReady", { apiVersion: 1 });
      setHeight(0);
    </script>
  </body>
</html>
